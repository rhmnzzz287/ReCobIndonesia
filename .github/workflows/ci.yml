name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Mutu front-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:tokens
      - run: npm run check:env
      - run: npm run check:emoji
      - run: npm run check:terms
      - run: npm run check:secrets
      - run: npm run check:alur
      - run: npm run test
      - run: npm run build
      - name: Simpan artefak laporan token
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokens-json
          path: apps/web/styles/tokens.json

  backend-artifacts:
    name: Artefak backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test --workspace @recobid/backend
      - run: npm run typecheck --workspace @recobid/backend
      - name: Tes RLS terhadap project tertaut
        # `secrets` tidak tersedia pada `steps[*].if` (hanya env, github, inputs, job, matrix,
        # needs, runner, steps, strategy, vars). Menulisnya di sana membuat SELURUH workflow
        # ditolak GitHub: run gagal dalam 0 detik tanpa satu pun job. Pola yang benar adalah
        # menaruh rahasianya di `env` lalu memeriksa `env` di `if`.
        if: ${{ env.SUPABASE_DB_URL != '' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run test:rls --workspace @recobid/backend

  e2e:
    name: Uji end-to-end
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Siapkan .env.local dari secrets (opsional)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\nDEMO_MODE=false\n' \
              "$NEXT_PUBLIC_SUPABASE_URL" "$NEXT_PUBLIC_SUPABASE_ANON_KEY" > apps/web/.env.local
            # Playwright berjalan sebagai proses terpisah, jadi `.env.local` yang dibaca server
            # Next tidak sampai ke `test.skip(process.env.NEXT_PUBLIC_SUPABASE_URL === ...)`.
            # Tanpa baris ini, skenario lead nyata selalu dilewati walau secrets terisi.
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$NEXT_PUBLIC_SUPABASE_URL" >> "$GITHUB_ENV"
          else
            printf 'DEMO_MODE=true\n' > apps/web/.env.local
          fi
      - run: npm run e2e
